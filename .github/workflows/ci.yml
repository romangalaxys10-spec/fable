name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run build

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test

  anti-fabrication-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: No hardcoded victory constants
        run: |
          # The original codebase hardcoded results (simulatedVulnerable=false,
          # passed: targets.length, flakeScore: 78). These patterns must never
          # return IN CODE. Comment lines (* or //) and honest refusal strings
          # that document the removed fakes are excluded.
          HITS=$(grep -rnE "const simulatedVulnerable|passed: targets\.length|flakeScore: 78|accuracy: 98|grade: .?ELITE_CERTIFIED" packages/ server.ts --include="*.ts" | grep -vE ':[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Fabricated-result pattern detected in source"
            echo "$HITS"
            exit 1
          else
            echo "OK: no fabricated-result patterns in executable code"
          fi
      - name: Every test reports honestly
        run: npm test

  api-health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Start the studio server
        run: |
          nohup npm run dev > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for /api/status
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/status > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not come up within 60s"
          tail -50 server.log
          exit 1
      - name: Assert endpoint contracts (strict — failures exit 1)
        env:
          FABLE_REQUIRE_SERVER: '1'
        run: node tests/api-health-check.mjs
      - name: E2E system audit against the live server (up-branch)
        run: npx tsx tests/e2e-system-audit.ts
      - name: Stop server
        if: always()
        run: |
          kill "$(cat server.pid)" 2>/dev/null || true
          tail -20 server.log
