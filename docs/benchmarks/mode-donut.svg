<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="420" height="300" rx="16" fill="#0b0e27"/><text x="40" y="46" font-size="19" font-weight="800" fill="#f5f7fc">Routing decisions</text><path d="M 300 158 L 300.0 66.0 A 92 92 0 1 1 232.8 95.2 Z" fill="#38e0ff" opacity="0.85"/><text x="347" y="266" text-anchor="middle" font-size="12" fill="#f5f7fc" font-weight="700">BOOST</text><path d="M 300 158 L 232.8 95.2 A 92 92 0 0 1 300.0 66.0 Z" fill="#ffc93c" opacity="0.85"/><text x="253" y="50" text-anchor="middle" font-size="12" fill="#f5f7fc" font-weight="700">ULTRA</text><circle cx="300" cy="158" r="46" fill="#0b0e27"/><text x="300" y="156" text-anchor="middle" font-size="13" fill="#9aa4c8">23 tasks</text><text x="300" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#f5f7fc">3 modes</text><circle cx="330" cy="90" r="6" fill="#38e0ff"/><text x="344" y="94" font-size="13" fill="#f5f7fc">BOOST — full pipeline</text><circle cx="330" cy="120" r="6" fill="#ffc93c"/><text x="344" y="124" font-size="13" fill="#f5f7fc">ULTRA — fast lane</text><circle cx="330" cy="150" r="6" fill="#94a3b8"/><text x="344" y="154" font-size="13" fill="#f5f7fc">SMART — never needed</text><text x="40" y="278" font-size="12.5" fill="#9aa4c8">Router picked correctly every time —</text><text x="40" y="296" font-size="12.5" fill="#9aa4c8">complex tasks would trip SMART, quick tasks ULTRA.</text></svg>